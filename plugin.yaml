name: freebusy
version: 0.3.0
manifest_version: 2
api_version: 1
description: "Meeting scheduling by email or chat, on any calendar and mailbox, that never reveals a calendar and never invents a time zone. Offers come from free/busy only, every slot is held before it is offered, and a time is never shown in a zone the other person did not give. Connects over CalDAV and IMAP/SMTP with app passwords kept in the system keychain; fixture mode needs no accounts."
author: David Tsai
license: MIT
kind: standalone
platforms:
  - linux
  - macos
tags: [scheduling, email, calendar, time-zones, caldav, imap, chat]
requires_hermes: ">=0.22.5"
provides_tools:
  - schedule_parse
  - schedule_offer
  - schedule_check
  - schedule_book
  - schedule_holds
  - schedule_resume
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_llm_call
  - post_approval_response
  - post_gateway_admission
requires_env: []
python_dependencies:
  - "keyring>=25.7,<26"
config_schema:
  mode:
    type: str
    choices: [fixture, connectors, google_workspace]
    default: fixture
    label: Adapter
    description: "fixture runs on demo data and touches nothing. connectors uses the calendars and mailbox set up with /freebusy connect (CalDAV, IMAP/SMTP, chat); /freebusy connect switches it on once its test passes. google_workspace is an inert stub until 0.4: it reads and writes nothing."
  owner_name:
    type: str
    default: ""
    label: Owner name
    description: "Shown in the signature: AI assistant to <name>."
  home_zone:
    type: str
    default: America/Los_Angeles
    label: Home time zone
    description: "IANA zone. Every offer is shown in this zone; a second zone only when the person stated theirs."
  owner_addresses:
    type: list
    default: []
    description: "The owner's own addresses. Only mail from these carries authority."
  identity_mode:
    type: str
    choices: [plus, same, alias]
    default: plus
    label: How the assistant sends mail
    description: "plus: you+agent@yourdomain. same: your own address, every message marked as the assistant's. alias: its own address."
  agent_address:
    type: str
    default: ""
    description: "The address the assistant works from (plus address, marked same address, or alias)."
  write_calendar:
    type: str
    default: ""
    label: Where holds go
    description: "The one calendar the plugin may write holds and bookings to (connection|calendar URL), or local: a hold store on this machine, exported as a calendar feed file you can subscribe to."
  read_calendars:
    type: list
    default: []
    label: Calendars read for busy times
    description: "Any number of calendars, across accounts, read as busy start and end times only."
  connections:
    type: dict
    default: {}
    label: Connections
    description: "Set by /freebusy connect. Servers and user names only (CalDAV URL; IMAP and SMTP hosts and ports). App passwords are in the system keychain, never here."
  mail_connection:
    type: str
    default: ""
    label: Mailbox the assistant works from
    description: "The id of an IMAP/SMTP connection. Blank: no mail connector."
  meeting_link:
    type: str
    default: ""
    label: Fixed meeting link
    description: "An https link put on every meeting the assistant books, such as a Zoom personal room, Jitsi or Whereby. Blank for none."
  chat_contacts:
    type: dict
    default: {}
    label: Chat contacts
    description: "People whose scheduling requests arrive over Hermes' chat channels, keyed platform:user_id (for example telegram:123456789), each with an email, a name, or {email, name, group}. Listing someone is your introduction. Everyone else, you included, talks to the agent as usual."
  groups:
    type: dict
    label: Groups
    description: "Each group has its own windows by weekday (in your zone), buffer, default length, earliest day out, horizon, tier (0 Trial, 1 Offer, 2 Book, 3 Manage), visibility (busy_only or full), travel buffers (off by default) and its members by address or domain. Senders who match no group get the default group. Edit here, or with /schedule group <name> <setting> <value>."
    default:
      Work:
        windows: {mon: ["09:00-17:00"], tue: ["09:00-17:00"], wed: ["09:00-17:00"], thu: ["09:00-17:00"], fri: ["09:00-17:00"]}
        buffer_min: 15
        default_len_min: 30
        earliest_days_out: 1
        horizon_days: 14
        tier: 0
        visibility: busy_only
        members: []
        domains: []
        travel_buffers: false
      Family:
        windows: {mon: ["07:00-21:00"], tue: ["07:00-21:00"], wed: ["07:00-21:00"], thu: ["07:00-21:00"], fri: ["07:00-21:00"], sat: ["07:00-21:00"], sun: ["07:00-21:00"]}
        buffer_min: 0
        default_len_min: 30
        earliest_days_out: 0
        horizon_days: 14
        tier: 0
        visibility: full
        members: []
        domains: []
        travel_buffers: false
  default_group:
    type: str
    default: Work
    label: Default group
    description: "The group for senders who match no group's members or domains."
  allowlist:
    type: dict
    default: {}
    description: "Sender address to tier (0 Trial, 1 Offer, 2 Book). Unknown senders never get a reply without you, whatever the tier."
  auto_book:
    type: bool
    default: true
    label: Book on a fitting stated time
    description: "On: an introduced sender's fitting pick is booked at once and the owner is told (in groups at tier 2 Book). Off: the owner approves first (/schedule approve, an email reply, or a Hermes approval), and the booking then goes ahead in the same run. Groups in Trial always wait for the owner; finishing /schedule setup moves them to Book (on) or Offer (off)."
  max_len_without_owner_min:
    type: int
    default: 59
    description: "Meetings longer than this go to the owner before anything is offered."
  vet_other_tools:
    type: bool
    default: false
    label: Also vet other plugins' send and calendar tools
    description: "Off: the policy gate covers only this plugin's own actions. On: send_email, email_send, gmail_send, mail_send, reply_email, calendar_create_event, create_event, calendar_write and book_event from any plugin are held to the same rules, and are blocked when they carry no thread_id."
  notice_hours:
    type: int
    default: 24
  hold_expiry_hours:
    type: int
    default: 48
  max_open_holds:
    type: int
    default: 12
  reminders_on:
    type: bool
    default: true
    label: Reminders
    description: "For every event the assistant books: reminders on the event, a text to you before it, and a day-before briefing. Never sent to the other person."
  reminder_popup_min:
    type: int
    default: 10
    label: Pop-up before (minutes)
  reminder_email_min:
    type: int
    default: 1440
    label: Calendar email before (minutes)
  reminder_text_before_min:
    type: int
    default: 60
    label: Text to you before (minutes)
  reminder_channel:
    type: str
    choices: [telegram, sms, imessage, email]
    default: email
    label: Where texts go
    description: "Sent through Hermes' own messaging (iMessage through BlueBubbles). The channel's sign-in is set in Hermes, never here."
  reminder_target:
    type: str
    default: ""
    label: Your chat, number or address
    description: "Your own. Blank uses the channel's home. Email reminders go to one of your own addresses only."
  briefing_on:
    type: bool
    default: true
    label: Day-before briefing
  briefing_at:
    type: str
    default: "17:00"
    label: Briefing time, the evening before
  base_address:
    type: str
    default: ""
    label: Base address for travel buffers
    description: "Where travel time is measured from. Used on this machine only, never sent."
  default_travel_min:
    type: int
    default: 30
    label: Travel minutes each way
    description: "For an in-person event when no distance table entry exists. No maps service is called."
